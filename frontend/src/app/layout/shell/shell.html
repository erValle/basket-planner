<div class="min-h-screen bg-slate-950 text-slate-100">
	<header class="sticky top-0 z-10 border-b border-white/10 bg-slate-950/80 backdrop-blur">
		<div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
			<ng-container *ngIf="role$ | async as role; else brandGuest">
				<a [routerLink]="role === 'player' ? '/player' : '/dashboard'" class="font-semibold tracking-wide">Basket Planner</a>
			</ng-container>
			<ng-template #brandGuest>
				<a routerLink="/dashboard" class="font-semibold tracking-wide">Basket Planner</a>
			</ng-template>

			<div class="flex items-center gap-4">
				<nav class="flex flex-wrap gap-3 text-sm text-slate-200">
					<ng-container *ngIf="role$ | async as role">
						<ng-container *ngFor="let item of navItems$()">
							<a *ngIf="canSee(item.roles, role)" [routerLink]="item.route" class="hover:text-white">
								{{ item.label }}
							</a>
						</ng-container>
					</ng-container>
				</nav>

				<div class="hidden items-center gap-3 sm:flex" *ngIf="(user$ | async) as user">
					<div class="text-right leading-tight">
						<div class="text-xs text-slate-300">{{ user.name }}</div>
						<div class="text-[11px] text-slate-400">{{ roleLabel(user.role) }}</div>
					</div>
					<button type="button" class="text-xs text-slate-200 hover:text-white" (click)="logout()">Logout</button>
				</div>
			</div>
		</div>
	</header>

	@if (showClubSelector) {
		<div class="border-b border-white/10 bg-slate-950/70 backdrop-blur">
			<div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-3">
				<div class="text-xs text-slate-400">Club</div>
				<p-select
					[options]="(clubOptions | async) ?? []"
					optionLabel="name"
					optionValue="id"
					[(ngModel)]="selectedClubId"
					(ngModelChange)="onSelectedClubChange($event)"
					placeholder="Selecciona club"
					styleClass="bp-select w-[260px]"
					[panelStyleClass]="'bp-select-panel'"
					[showClear]="false"
				></p-select>
			</div>
		</div>
	}

	<main class="mx-auto max-w-6xl px-4 py-6">
		<router-outlet />
	</main>
