<div class="flex flex-col max-h-[80vh]">
	<!-- Header -->
	<div class="border-b border-[#1f2937] px-6 py-4 flex items-center justify-between">
		<div>
			<h2 class="text-[18px] text-[#f9fafb] mb-1">{{ title }}</h2>
			<p class="text-[12px] text-[#9ca3af]">{{ subtitle }}</p>
		</div>
		<button
			type="button"
			pButton
			icon="pi pi-times"
			class="p-button-text p-button-sm"
			(click)="onCancel()"
			aria-label="Cerrar"
		></button>
	</div>

	<!-- Search -->
	<div class="px-6 py-4 border-b border-[#1f2937]">
		<div class="relative">
			<span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#6b7280]">🔎</span>
			<input
				pInputText
				type="text"
				[(ngModel)]="searchTerm"
				name="searchTerm"
				placeholder="Buscar por nombre o posición..."
				class="w-full pl-10"
			/>
		</div>
	</div>

	<!-- Players List -->
	<div class="flex-1 overflow-y-auto px-6 py-4">
		<div class="space-y-2">
			@for (player of filteredPlayers; track player.id) {
				<button
					type="button"
					pButton
					(click)="togglePlayer(player.id)"
					styleClass="w-full justify-between text-left px-4 py-3 rounded-lg border transition-colors"
					[ngClass]="
						isSelected(player.id)
							? 'bg-[#0ea5e9] border-[#0ea5e9] text-[#0f172a]'
							: 'bg-[#111827] border-[#1f2937] text-[#e5e7eb] hover:border-[#374151]'
					"
				>
					<div class="flex items-center justify-between">
						<div>
							<div class="text-[14px]">{{ player.nombre }}</div>
							<div
								class="text-[12px]"
								[ngClass]="isSelected(player.id) ? 'text-[#0f172a]/70' : 'text-[#9ca3af]'"
							>
								{{ player.posicion }} · {{ player.categoria }}
							</div>
						</div>
						@if (isSelected(player.id)) {
							<span class="text-[18px]">✓</span>
						}
					</div>
				</button>
			}
		</div>
	</div>

	<!-- Footer -->
	<div class="border-t border-[#1f2937] px-6 py-4 flex justify-between items-center">
		<div class="text-[12px] text-[#9ca3af]">{{ selected.length }} jugadores seleccionados</div>
		<div class="flex gap-2">
			<p-button
				label="Cancelar"
				severity="secondary"
				[outlined]="true"
				(click)="onCancel()"
			></p-button>
			<p-button label="Añadir jugadores" (click)="onConfirm()"></p-button>
		</div>
	</div>
</div>
