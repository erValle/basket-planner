  # ==================== TRAINING PLAN GENERATION ENDPOINTS ====================
  /training-plans/generate/individual:
    post:
      summary: Generar plan individual
      description: |
        Genera un plan de entrenamiento personalizado para un jugador usando el sistema de recomendación con IA.

        **Caso de uso:** CU.023 - Generación de plan individual

        **Roles permitidos:** admin, technical_director, coach

        **Usado en:** Asistente de nueva planificación

        El sistema utiliza un modelo TensorFlow TFRS (Two-Tower) para seleccionar los ejercicios más adecuados según:
        - Objetivos del entrenamiento
        - Intensidad deseada
        - Equipamiento disponible
        - Duración de cada sesión
      tags: [Training Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndividualGenerateRequest'
            examples:
              profile:
                playerId: 5
                position: base
                numberOfSessions: 3
                sessionDurationMinutes: 75
                intensity: medium
              goals:
                - tiro
                - pase
              constraints:
                equipment:
                  - balón
                  - conos
      responses:
        '201':
          description: Plan generado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Error en la generación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /training-plans/generate/group:
    post:
      summary: Generar plan grupal
      description: |
        Genera un plan de entrenamiento para un grupo de jugadores.

        **Caso de uso:** CU.024 - Generación de plan grupal

        **Roles permitidos:** admin, technical_director, coach

        Similar a la generación individual pero optimizado para grupos de 2-30 jugadores.
      tags: [Training Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupGenerateRequest'
      responses:
        '201':
          description: Plan generado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Error en la generación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /training-plans/{id}/versions/{versionId}/export:
    get:
      summary: Exportar versión
      description: |
        Exporta una versión de planificación en formato CSV o PDF.

        **Caso de uso:** CU.027 - Exportar versión

        **Roles permitidos:** admin, technical_director, coach, player (propio)
      tags: [Training Plans]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, pdf]
            default: csv
      responses:
        '200':
          description: Archivo exportado
          content:
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

