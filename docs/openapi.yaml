openapi: 3.1.0
info:
  title: Basket Planner API
  description: |
    API REST para el sistema de planificación de entrenamientos de baloncesto.

    ## Autenticación
    La API utiliza autenticación basada en JWT (Bearer Token). Para acceder a los endpoints protegidos,
    incluye el token en el header `Authorization: Bearer <token>`.

    ## Roles del sistema
    - **admin**: Acceso completo a todas las funcionalidades
    - **technical_director**: Gestión de su club y equipos
    - **coach**: Gestión de sus equipos y entrenamientos
    - **player**: Acceso a sus planificaciones y feedback
    - **user**: Usuario base sin rol específico

    ## Sistema de recomendación
    El sistema utiliza un modelo TensorFlow TFRS (Two-Tower) para recomendar ejercicios
    personalizados según objetivos, intensidad y equipamiento disponible.
  version: 1.0.0
  contact:
    name: Basket Planner Team
  license:
    name: MIT

servers:
  - url: http://localhost:3000/api
    description: Servidor de desarrollo
  - url: https://api.basket-planner.com/api
    description: Servidor de producción

tags:
  - name: Auth
    description: Autenticación y gestión de sesión
  - name: Users
    description: Gestión de usuarios del sistema
  - name: Clubs
    description: Gestión de clubes deportivos
  - name: Teams
    description: Gestión de equipos y sus jugadores
  - name: Players
    description: Gestión específica de jugadores
  - name: Exercises
    description: Catálogo de ejercicios de entrenamiento
  - name: Equipment
    description: Gestión de material deportivo
  - name: Training Plans
    description: Planes de entrenamiento (incluye generación automática con IA)
  - name: Training Plan Versions
    description: Versionado de planes de entrenamiento
  - name: Plan Assignments
    description: Asignaciones de planes a usuarios
  - name: Feedbacks
    description: Valoraciones y comentarios sobre entrenamientos
  - name: Metrics
    description: Métricas del sistema
  - name: Audit Logs
    description: Registros de auditoría
  - name: Monitoring
    description: Monitorización y KPIs del sistema
  - name: Recommender
    description: Sistema de recomendación (modelo ML)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido en el login

  schemas:
    # ==================== ERROR SCHEMAS ====================
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              examples: VALIDATION_ERROR
            message:
              type: string
              examples: Validation failed
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string

    ValidationError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              examples: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object

    # ==================== AUTH SCHEMAS ====================
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          examples: admin@examples.com
        password:
          type: string
          minLength: 6
          maxLength: 128
          examples: password123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token para autenticación
        tokenType:
          type: string
          examples: Bearer
        expiresIn:
          type: string
          examples: 24h
        user:
          $ref: '#/components/schemas/UserBasic'

    # ==================== USER SCHEMAS ====================
    UserBasic:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, technical_director, coach, player, user]
        status:
          type: string
          enum: [active, inactive]

    User:
      allOf:
        - $ref: '#/components/schemas/UserBasic'
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    CreateUserRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          minLength: 6
          maxLength: 128
        role:
          type: string
          enum: [admin, technical_director, coach, player, user]
          default: user
        status:
          type: string
          enum: [active, inactive]

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
          maxLength: 100
        password:
          type: string
          minLength: 6
          maxLength: 128
        role:
          type: string
          enum: [admin, technical_director, coach, player, user]
        status:
          type: string
          enum: [active, inactive]

    AssignUsersToClubRequest:
      type: object
      required:
        - userIds
        - clubId
      properties:
        userIds:
          type: array
          items:
            type: integer
          minItems: 1
        clubId:
          type: integer

    # ==================== CLUB SCHEMAS ====================
    Club:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateClubRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
          nullable: true
        city:
          type: string
          maxLength: 120
          nullable: true
        country:
          type: string
          maxLength: 120
          nullable: true
        status:
          type: string
          enum: [active, inactive]

    UpdateClubRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 500
          nullable: true
        city:
          type: string
          maxLength: 120
          nullable: true
        country:
          type: string
          maxLength: 120
          nullable: true
        status:
          type: string
          enum: [active, inactive]

    # ==================== TEAM SCHEMAS ====================
    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          nullable: true
        clubId:
          type: integer
        coachId:
          type: integer
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTeamRequest:
      type: object
      required:
        - name
        - clubId
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        category:
          type: string
          maxLength: 60
          nullable: true
        clubId:
          type: integer
        coachId:
          type: integer
          nullable: true
        active:
          type: boolean

    UpdateTeamRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        category:
          type: string
          maxLength: 60
        clubId:
          type: integer
        coachId:
          type: integer
          nullable: true
        active:
          type: boolean

    AddTeamPlayerRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer

    AddTeamPlayersBulkRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          items:
            type: integer
          minItems: 1

    # ==================== PLAYER SCHEMAS ====================
    Player:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
        position:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        height:
          type: number
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true

    EnrollPlayerRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
        clubId:
          type: integer
          description: Si se omite, se usa el club del coach
        startDate:
          type: string
          format: date

    UpdatePlayerProfileRequest:
      type: object
      minProperties: 1
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        status:
          type: string
          enum: [active, inactive]
        position:
          type: string
          maxLength: 50
          nullable: true
        category:
          type: string
          maxLength: 50
          nullable: true
        maxCategory:
          type: string
          maxLength: 50
          nullable: true
        height:
          type: number
          minimum: 0
          maximum: 300
          nullable: true
        dateOfBirth:
          type: string
          format: date
          nullable: true

    TransferPlayerRequest:
      type: object
      required:
        - clubId
      properties:
        clubId:
          type: integer
        startDate:
          type: string
          format: date
        closePreviousAt:
          type: string
          format: date
        makePrimary:
          type: boolean
          default: true

    # ==================== EXERCISE SCHEMAS ====================
    ExerciseDifficulty:
      type: object
      required:
        - tactica
        - tecnica
        - fisica
        - mental
      properties:
        tactica:
          type: integer
          minimum: 1
          maximum: 5
        tecnica:
          type: integer
          minimum: 1
          maximum: 5
        fisica:
          type: integer
          minimum: 1
          maximum: 5
        mental:
          type: integer
          minimum: 1
          maximum: 5

    Exercise:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [tecnico, tactico, fisico, tiro, defensa, ataque]
        difficulty:
          $ref: '#/components/schemas/ExerciseDifficulty'
        duration:
          type: integer
          description: Duración en minutos
        description:
          type: string
          nullable: true
        tags:
          oneOf:
            - type: array
              items:
                type: string
            - type: object
              properties:
                tipo_original:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                materiales:
                  type: array
                  items:
                    type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateExerciseRequest:
      type: object
      required:
        - name
        - type
        - difficulty
        - duration
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        type:
          type: string
          enum: [tecnico, tactico, fisico, tiro, defensa, ataque]
        difficulty:
          $ref: '#/components/schemas/ExerciseDifficulty'
        duration:
          type: integer
          minimum: 1
        description:
          type: string
          nullable: true
        tags:
          oneOf:
            - type: array
              items:
                type: string
                maxLength: 40
            - type: object
        active:
          type: boolean

    UpdateExerciseRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        type:
          type: string
          enum: [tecnico, tactico, fisico, tiro, defensa, ataque]
        difficulty:
          $ref: '#/components/schemas/ExerciseDifficulty'
        duration:
          type: integer
          minimum: 1
        description:
          type: string
          nullable: true
        tags:
          oneOf:
            - type: array
              items:
                type: string
            - type: object
        active:
          type: boolean

    # ==================== EQUIPMENT SCHEMAS ====================
    Equipment:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        clubId:
          type: integer
          nullable: true
        status:
          type: string
          enum: [available, unavailable, maintenance]
        characteristics:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateEquipmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        clubId:
          type: integer
        status:
          type: string
          enum: [available, unavailable, maintenance]
        characteristics:
          type: object

    UpdateEquipmentRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        clubId:
          type: integer
        status:
          type: string
          enum: [available, unavailable, maintenance]
        characteristics:
          type: object

    # ==================== TRAINING PLAN SCHEMAS ====================
    TrainingPlan:
      type: object
      properties:
        id:
          type: integer
        createdById:
          type: integer
        targetType:
          type: string
          enum: [team, user]
        name:
          type: string
        goal:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        intensity:
          type: string
          nullable: true
        duration:
          type: integer
          nullable: true
        status:
          type: string
          enum: [draft, active, archived]
        activeVersionId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTrainingPlanRequest:
      type: object
      required:
        - createdById
        - targetType
        - name
      properties:
        createdById:
          type: integer
        targetType:
          type: string
          enum: [team, user]
        name:
          type: string
          minLength: 2
          maxLength: 200
        goal:
          type: string
          nullable: true
        type:
          type: string
          maxLength: 60
        intensity:
          type: string
          maxLength: 60
        duration:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, active, archived]

    UpdateTrainingPlanRequest:
      type: object
      minProperties: 1
      properties:
        targetType:
          type: string
          enum: [team, user]
        name:
          type: string
          minLength: 2
          maxLength: 200
        goal:
          type: string
          nullable: true
        type:
          type: string
          maxLength: 60
        intensity:
          type: string
          maxLength: 60
        duration:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, active, archived]

    # ==================== TRAINING PLAN VERSION SCHEMAS ====================
    TrainingPlanVersion:
      type: object
      properties:
        id:
          type: integer
        trainingPlanId:
          type: integer
        versionNumber:
          type: integer
        source:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        comments:
          type: string
          nullable: true
        sessions:
          type: object
          description: Estructura JSON con las sesiones del plan
        createdFrom:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTrainingPlanVersionRequest:
      type: object
      required:
        - versionNumber
        - date
      properties:
        versionNumber:
          type: integer
          minimum: 1
        source:
          type: string
          maxLength: 100
        date:
          type: string
          format: date-time
        comments:
          type: string
          nullable: true
        sessions:
          type: object
        createdFrom:
          type: object

    UpdateTrainingPlanVersionRequest:
      type: object
      minProperties: 1
      properties:
        source:
          type: string
          maxLength: 100
        date:
          type: string
          format: date-time
        comments:
          type: string
          nullable: true
        sessions:
          type: object
        createdFrom:
          type: object

    RestoreTrainingPlanVersionRequest:
      type: object
      properties:
        comments:
          type: string
          nullable: true
        date:
          type: string
          format: date-time
        source:
          type: string
          enum: [manual, automatic]
          default: manual
        createdFrom:
          type: object

    # ==================== PLAN ASSIGNMENT SCHEMAS ====================
    PlanAssignment:
      type: object
      properties:
        id:
          type: integer
        trainingPlanId:
          type: integer
        userId:
          type: integer
        assignedById:
          type: integer
        assignedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [assigned, in_progress, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePlanAssignmentRequest:
      type: object
      required:
        - trainingPlanId
        - userId
        - assignedById
      properties:
        trainingPlanId:
          type: integer
        userId:
          type: integer
        assignedById:
          type: integer
        assignedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [assigned, in_progress, completed, cancelled]

    UpdatePlanAssignmentRequest:
      type: object
      minProperties: 1
      properties:
        assignedById:
          type: integer
        assignedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [assigned, in_progress, completed, cancelled]

    # ==================== PLANNING GENERATION SCHEMAS ====================
    IndividualGenerateRequest:
      type: object
      required:
        - profile
      properties:
        profile:
          type: object
          required:
            - playerId
          properties:
            playerId:
              type: integer
              description: ID del jugador para el que se genera el plan
            position:
              type: string
              enum: [base, escolta, alero, ala-pivot, pivot]
            numberOfSessions:
              type: integer
              minimum: 1
              maximum: 7
              default: 3
              description: Número de sesiones a generar
            sessionDurationMinutes:
              type: integer
              minimum: 15
              maximum: 240
              default: 75
              description: Duración de cada sesión en minutos
            intensity:
              type: string
              enum: [low, medium, high]
              default: medium
        goals:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 64
          maxItems: 20
          default: []
          description: Objetivos del entrenamiento (ej. tiro, defensa, pase)
        constraints:
          type: object
          properties:
            equipment:
              type: array
              items:
                type: string
              maxItems: 20
              description: Equipamiento disponible para filtrar ejercicios

    GroupGenerateRequest:
      type: object
      required:
        - group
        - profiles
      properties:
        group:
          type: object
          properties:
            groupId:
              type: integer
            name:
              type: string
              minLength: 2
              maxLength: 64
            numberOfSessions:
              type: integer
              minimum: 1
              maximum: 7
              default: 3
            sessionDurationMinutes:
              type: integer
              minimum: 15
              maximum: 240
              default: 90
            intensity:
              type: string
              enum: [low, medium, high]
              default: medium
        profiles:
          type: array
          items:
            type: object
            required:
              - playerId
            properties:
              playerId:
                type: integer
              position:
                type: string
                enum: [base, escolta, alero, ala-pivot, pivot]
          minItems: 2
          maxItems: 30
        goals:
          type: array
          items:
            type: string
          maxItems: 20
          default: []
        constraints:
          type: object
          properties:
            equipment:
              type: array
              items:
                type: string
              maxItems: 20

    GeneratedPlan:
      type: object
      properties:
        id:
          type: integer
          description: ID del plan de entrenamiento creado
        sessions:
          type: array
          items:
            type: object
            properties:
              sessionNumber:
                type: integer
              totalDuration:
                type: integer
              exercises:
                type: array
                items:
                  $ref: '#/components/schemas/Exercise'
        partialGeneration:
          type: boolean
          description: Indica si la generación fue parcial por timeout
        wasAborted:
          type: boolean
          description: Indica si la generación fue abortada
        requestedSessions:
          type: integer
          description: Número de sesiones solicitadas originalmente

    # ==================== FEEDBACK SCHEMAS ====================
    FeedbackRating:
      type: object
      minProperties: 1
      properties:
        physicalEffort:
          type: integer
          minimum: 1
          maximum: 10
        technicalEffort:
          type: integer
          minimum: 1
          maximum: 10
        mentalEffort:
          type: integer
          minimum: 1
          maximum: 10
        overall:
          type: integer
          minimum: 1
          maximum: 10
        rpe:
          type: integer
          minimum: 1
          maximum: 10
          description: Rate of Perceived Exertion
        fatigue:
          type: integer
          minimum: 1
          maximum: 10
        pain:
          type: integer
          minimum: 0
          maximum: 10
        sleep:
          type: integer
          minimum: 1
          maximum: 5
        stress:
          type: integer
          minimum: 1
          maximum: 5
        mood:
          type: integer
          minimum: 1
          maximum: 5

    Feedback:
      type: object
      properties:
        id:
          type: integer
        trainingPlanVersionId:
          type: integer
        userId:
          type: integer
        targetType:
          type: string
          enum: [version, session]
        sessionId:
          type: string
          nullable: true
        rating:
          $ref: '#/components/schemas/FeedbackRating'
        comments:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateFeedbackRequest:
      type: object
      required:
        - trainingPlanVersionId
        - rating
      properties:
        trainingPlanVersionId:
          type: integer
        targetType:
          type: string
          enum: [version, session]
          default: version
        sessionId:
          type: string
          description: Requerido si targetType es 'session'
        rating:
          $ref: '#/components/schemas/FeedbackRating'
        comments:
          type: string
          nullable: true

    UpdateFeedbackRequest:
      type: object
      minProperties: 1
      properties:
        rating:
          $ref: '#/components/schemas/FeedbackRating'
        comments:
          type: string
          nullable: true

    FeedbackStats:
      type: object
      properties:
        totalFeedbacks:
          type: integer
        averageRatings:
          type: object
        feedbacksBySession:
          type: array
          items:
            type: object

    # ==================== METRIC SCHEMAS ====================
    Metric:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        value:
          type: number
        metadata:
          type: object
        recordedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMetricRequest:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        value:
          type: number
        metadata:
          type: object
        recordedAt:
          type: string
          format: date-time

    # ==================== AUDIT LOG SCHEMAS ====================
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
          nullable: true
        action:
          type: string
        entity:
          type: string
        entityId:
          type: integer
          nullable: true
        metadata:
          type: object
        requestId:
          type: string
        createdAt:
          type: string
          format: date-time

    # ==================== MONITORING SCHEMAS ====================
    SystemStatus:
      type: object
      properties:
        modelStatus:
          type: string
          enum: [loaded, not_loaded, error]
        totalPlans:
          type: integer
        totalExercises:
          type: integer
        queryLatencyMs:
          type: integer

    KPIs:
      type: object
      properties:
        totalActions:
          type: integer
        actionsPerDay:
          type: number
        errorRatePct:
          type: number

    # ==================== RECOMMENDER SCHEMAS ====================
    RecommenderStatus:
      type: object
      properties:
        activeVersion:
          type: string
        modelType:
          type: string
        isLoaded:
          type: boolean
        metrics:
          type: object
          properties:
            accuracy:
              type: number
            coverage:
              type: number
            latencyMs:
              type: number

    # ==================== USER CLUB SCHEMAS ====================
    UserClub:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        clubId:
          type: integer
        isPrimary:
          type: boolean
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserClubRequest:
      type: object
      required:
        - userId
        - clubId
      properties:
        userId:
          type: integer
        clubId:
          type: integer
        isPrimary:
          type: boolean
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    # ==================== EXERCISE EQUIPMENT SCHEMAS ====================
    ExerciseEquipment:
      type: object
      properties:
        exerciseId:
          type: integer
        equipmentId:
          type: integer
        equipment:
          $ref: '#/components/schemas/Equipment'

    CreateExerciseEquipmentRequest:
      type: object
      required:
        - equipmentId
      properties:
        equipmentId:
          type: integer

  responses:
    BadRequest:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            error:
              code: VALIDATION_ERROR
              message: "Validation failed"
              details:
                - path: "email"
                  message: "must be a valid email"

    Unauthorized:
      description: No autenticado - Token JWT inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              code: UNAUTHORIZED
              message: "Token not provided or invalid"

    Forbidden:
      description: No autorizado - Permisos insuficientes para esta acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              code: FORBIDDEN
              message: "You don't have permission to perform this action"

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              code: NOT_FOUND
              message: "Resource not found"

    Conflict:
      description: Conflicto - El recurso ya existe o hay un conflicto de estado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              code: CONFLICT
              message: "Resource already exists"

    TooManyRequests:
      description: Demasiadas solicitudes - Rate limit excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              code: TOO_MANY_REQUESTS
              message: "Too many requests, please try again later"

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error:
              code: INTERNAL_SERVER_ERROR
              message: "An unexpected error occurred"

security:
  - BearerAuth: []

paths:
  # ==================== HEALTH CHECK ====================
  /health:
    get:
      summary: Health check
      description: Endpoint para verificar que el servidor está funcionando. No requiere autenticación.
      tags: [Monitoring]
      security: []
      responses:
        '200':
          description: Servidor funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: OK

  # ==================== AUTH ENDPOINTS ====================
  /auth/login:
    post:
      summary: Iniciar sesión
      description: |
        Autentica un usuario y devuelve un token JWT.

        **Caso de uso:** CU.001 - Autenticación

        **Rate limit:** 5 intentos por minuto
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Credenciales inválidas o faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examplesss:
                missing_credentials:
                  value:
                    error: MISSING_CREDENTIALS
                    message: Invalid credentials
                invalid_credentials:
                  value:
                    error: INVALID_CREDENTIALS
                    message: Invalid credentials
        '403':
          description: Usuario inactivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                error: USER_NOT_ACTIVE
                message: User account is not active
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/me:
    get:
      summary: Obtener usuario actual
      description: |
        Devuelve la información del usuario autenticado.

        **Usado en:** Header de la aplicación, perfil de usuario
      tags: [Auth]
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                error: USER_NOT_FOUND
                message: User not found

  # ==================== USER ENDPOINTS ====================
  /users:
    get:
      summary: Listar usuarios
      description: |
        Lista todos los usuarios del sistema con filtros opcionales.

        **Caso de uso:** CU.002 - Listado de usuarios

        **Roles permitidos:** admin, technical_director

        **Usado en:** Panel de administración de usuarios
      tags: [Users]
      parameters:
        - name: email
          in: query
          schema:
            type: string
          description: Filtrar por email (búsqueda parcial)
        - name: search
          in: query
          schema:
            type: string
          description: Búsqueda en email, firstName, lastName
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, technical_director, coach, player, user]
          description: Filtrar por rol
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
          description: Filtrar por estado
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Crear usuario
      description: |
        Crea un nuevo usuario en el sistema.

        **Caso de uso:** CU.002 - Registro de usuarios

        **Roles permitidos:** admin

        **Usado en:** Panel de administración
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/assign-to-club:
    post:
      summary: Asignar usuarios a un club
      description: |
        Asigna múltiples usuarios a un club, convirtiéndolos en jugadores.

        **Roles permitidos:** admin, technical_director

        **Usado en:** Gestión de plantillas de club
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUsersToClubRequest'
      responses:
        '200':
          description: Usuarios asignados correctamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      summary: Obtener usuario por ID
      description: |
        Obtiene los detalles de un usuario específico.

        **Caso de uso:** CU.003 - Ver usuario

        **Roles permitidos:** admin, technical_director, o el propio usuario
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Actualizar usuario
      description: |
        Actualiza los datos de un usuario.

        **Caso de uso:** CU.003 - Edición de usuarios

        **Roles permitidos:** admin, o el propio usuario
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Eliminar usuario
      description: |
        Elimina un usuario del sistema.

        **Caso de uso:** CU.004 - Eliminación de usuarios

        **Roles permitidos:** admin
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Usuario eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

