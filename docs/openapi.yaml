        Actualiza el perfil deportivo de un jugador.

        **Caso de uso:** CU.012 - Edición de perfil jugador

        **Roles permitidos:** admin, technical_director, coach
      tags: [Players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlayerProfileRequest'
      responses:
        '200':
          description: Perfil actualizado
