<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Diagrama Chen (ER) — Basket Planner</title>
  <style>
    html, body { height: 100%; margin: 0; background: #fff; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .page {
      height: 100vh;
      width: 100vw;
      display: grid;
      place-items: center;
      overflow: auto;
      background: #fff;
    }
    svg { width: 100%; height: auto; min-height: 100vh; }
    .title { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 9px; fill: #444; }
    .entity { fill: #fff; stroke: #111; stroke-width: 1.5; }
    .relationship { fill: #fff; stroke: #111; stroke-width: 1.5; }
    .weak-entity { fill: #fff; stroke: #111; stroke-width: 2.5; }
    .identifying { fill: #fff; stroke: #111; stroke-width: 2.5; }
    .attr { fill: #fff; stroke: #111; stroke-width: 1; }
    .label { font-size: 10px; font-weight: 700; }
    .attrlabel { font-size: 8px; }
    .card { font-size: 8px; fill: #111; }
    .line { stroke: #111; stroke-width: 1; }
    .dash { stroke-dasharray: 4 4; }
    .role { font-size: 8px; fill: #111; font-style: italic; }
    .cardinality { font-size: 8px; fill: #111; font-weight: 700; }
  </style>
</head>
<body>
<div class="page">
  <svg viewBox="-10 0 1220 750" preserveAspectRatio="xMidYMid meet" aria-label="Diagrama Chen ER">
    <!-- TÍTULO -->
    <text x="600" y="22" text-anchor="middle" class="title">Diagrama Entidad–Relación (Chen) — Basket Planner (Backend)</text>
    <text x="600" y="36" text-anchor="middle" class="subtitle">Entidades (rectángulos), relaciones (rombos), atributos (óvalos), cardinalidades (1, N, 0..1).</text>

    <!-- ========== FILA 1: Club, Ejercicio, Planificación ========== -->

    <!-- Club -->
    <rect x="50" y="70" width="80" height="32" rx="4" class="entity"/>
    <text x="90" y="90" text-anchor="middle" class="label">Club</text>

    <ellipse cx="20" cy="86" rx="18" ry="10" class="attr"/>
    <text x="20" y="89" text-anchor="middle" class="attrlabel">id</text>
    <line x1="50" y1="86" x2="38" y2="86" class="line"/>

    <ellipse cx="90" cy="52" rx="28" ry="10" class="attr"/>
    <text x="90" y="55" text-anchor="middle" class="attrlabel">nombre</text>
    <line x1="90" y1="70" x2="90" y2="62" class="line"/>

    <ellipse cx="155" cy="72" rx="22" ry="10" class="attr"/>
    <text x="155" y="75" text-anchor="middle" class="attrlabel">ciudad</text>
    <line x1="130" y1="82" x2="140" y2="77" class="line"/>

    <ellipse cx="155" cy="100" rx="22" ry="10" class="attr"/>
    <text x="155" y="103" text-anchor="middle" class="attrlabel">activo</text>
    <line x1="130" y1="95" x2="140" y2="98" class="line"/>

    <!-- Ejercicio -->
    <rect x="400" y="70" width="80" height="32" rx="4" class="entity"/>
    <text x="440" y="90" text-anchor="middle" class="label">Ejercicio</text>

    <ellipse cx="370" cy="86" rx="18" ry="10" class="attr"/>
    <text x="370" y="89" text-anchor="middle" class="attrlabel">id</text>
    <line x1="400" y1="86" x2="388" y2="86" class="line"/>

    <ellipse cx="440" cy="52" rx="28" ry="10" class="attr"/>
    <text x="440" y="55" text-anchor="middle" class="attrlabel">nombre</text>
    <line x1="440" y1="70" x2="440" y2="62" class="line"/>

    <ellipse cx="510" cy="72" rx="18" ry="10" class="attr"/>
    <text x="510" y="75" text-anchor="middle" class="attrlabel">tipo</text>
    <line x1="480" y1="80" x2="498" y2="75" class="line"/>

    <ellipse cx="510" cy="100" rx="26" ry="10" class="attr"/>
    <text x="510" y="103" text-anchor="middle" class="attrlabel">dificultad</text>
    <line x1="480" y1="95" x2="492" y2="98" class="line"/>

    <!-- Planificación -->
    <rect x="700" y="70" width="100" height="32" rx="4" class="entity"/>
    <text x="750" y="90" text-anchor="middle" class="label">Planificación</text>

    <ellipse cx="670" cy="86" rx="18" ry="10" class="attr"/>
    <text x="670" y="89" text-anchor="middle" class="attrlabel">id</text>
    <line x1="700" y1="86" x2="688" y2="86" class="line"/>

    <ellipse cx="750" cy="52" rx="30" ry="10" class="attr"/>
    <text x="750" y="55" text-anchor="middle" class="attrlabel">nombre</text>
    <line x1="750" y1="70" x2="750" y2="62" class="line"/>

    <ellipse cx="830" cy="72" rx="24" ry="10" class="attr"/>
    <text x="830" y="75" text-anchor="middle" class="attrlabel">estado</text>
    <line x1="800" y1="80" x2="814" y2="75" class="line"/>

    <ellipse cx="830" cy="100" rx="22" ry="10" class="attr"/>
    <text x="830" y="103" text-anchor="middle" class="attrlabel">objetivo</text>
    <line x1="800" y1="95" x2="815" y2="98" class="line"/>

    <!-- ========== FILA 2: Equipo, Material, VersiónPlanificación ========== -->

    <!-- Equipo -->
    <rect x="180" y="160" width="80" height="32" rx="4" class="entity"/>
    <text x="220" y="180" text-anchor="middle" class="label">Equipo</text>

    <ellipse cx="160" cy="176" rx="18" ry="10" class="attr"/>
    <text x="160" y="179" text-anchor="middle" class="attrlabel">id</text>
    <line x1="180" y1="176" x2="172" y2="176" class="line"/>

    <ellipse cx="220" cy="205" rx="28" ry="10" class="attr"/>
    <text x="220" y="208" text-anchor="middle" class="attrlabel">nombre</text>
    <line x1="220" y1="192" x2="220" y2="198" class="line"/>

    <ellipse cx="280" cy="160" rx="32" ry="10" class="attr"/>
    <text x="280" y="163" text-anchor="middle" class="attrlabel">categoría</text>
    <line x1="260" y1="168" x2="258" y2="165" class="line"/>

    <ellipse cx="280" cy="190" rx="22" ry="10" class="attr"/>
    <text x="280" y="193" text-anchor="middle" class="attrlabel">activo</text>
    <line x1="260" y1="185" x2="265" y2="187" class="line"/>

    <!-- Material (Equipment en BD) -->
    <rect x="400" y="160" width="80" height="32" rx="4" class="entity"/>
    <text x="440" y="180" text-anchor="middle" class="label">Material</text>

    <ellipse cx="380" cy="176" rx="18" ry="10" class="attr"/>
    <text x="380" y="179" text-anchor="middle" class="attrlabel">id</text>
    <line x1="400" y1="176" x2="392" y2="176" class="line"/>

    <ellipse cx="440" cy="205" rx="28" ry="10" class="attr"/>
    <text x="440" y="208" text-anchor="middle" class="attrlabel">nombre</text>
    <line x1="440" y1="192" x2="440" y2="198" class="line"/>

    <ellipse cx="500" cy="176" rx="24" ry="10" class="attr"/>
    <text x="500" y="179" text-anchor="middle" class="attrlabel">estado</text>
    <line x1="480" y1="176" x2="484" y2="176" class="line"/>

    <!-- VersiónPlanificación -->
    <rect x="900" y="160" width="120" height="32" rx="4" class="weak-entity"/>
    <text x="960" y="180" text-anchor="middle" class="label">VersiónPlanificación</text>

    <ellipse cx="880" cy="176" rx="18" ry="10" class="attr"/>
    <text x="880" y="179" text-anchor="middle" class="attrlabel">id</text>
    <line x1="900" y1="176" x2="892" y2="176" class="line"/>

    <ellipse cx="960" cy="205" rx="42" ry="10" class="attr"/>
    <text x="960" y="208" text-anchor="middle" class="attrlabel">numeroVersion</text>
    <line x1="960" y1="192" x2="960" y2="198" class="line"/>

    <ellipse cx="1040" cy="160" rx="26" ry="10" class="attr"/>
    <text x="1040" y="163" text-anchor="middle" class="attrlabel">origen</text>
    <line x1="1020" y1="168" x2="1022" y2="165" class="line"/>

    <ellipse cx="1040" cy="190" rx="28" ry="10" class="attr"/>
    <text x="1040" y="193" text-anchor="middle" class="attrlabel">sesiones</text>
    <line x1="1020" y1="185" x2="1020" y2="188" class="line"/>

    <!-- ========== FILA 3: Usuario ========== -->

    <!-- Usuario -->
    <rect x="50" y="300" width="80" height="32" rx="4" class="entity"/>
    <text x="90" y="320" text-anchor="middle" class="label">Usuario</text>

    <ellipse cx="30" cy="316" rx="18" ry="10" class="attr"/>
    <text x="30" y="319" text-anchor="middle" class="attrlabel">id</text>
    <line x1="50" y1="316" x2="42" y2="316" class="line"/>

    <ellipse cx="90" cy="345" rx="24" ry="10" class="attr"/>
    <text x="90" y="348" text-anchor="middle" class="attrlabel">email</text>
    <line x1="90" y1="332" x2="90" y2="338" class="line"/>

    <ellipse cx="150" cy="300" rx="18" ry="10" class="attr"/>
    <text x="150" y="303" text-anchor="middle" class="attrlabel">rol</text>
    <line x1="130" y1="308" x2="138" y2="305" class="line"/>

    <ellipse cx="150" cy="330" rx="26" ry="10" class="attr"/>
    <text x="150" y="333" text-anchor="middle" class="attrlabel">estado</text>
    <line x1="130" y1="325" x2="132" y2="328" class="line"/>

    <ellipse cx="90" cy="375" rx="28" ry="10" class="attr"/>
    <text x="90" y="378" text-anchor="middle" class="attrlabel">nombre</text>
    <line x1="90" y1="355" x2="90" y2="368" class="line"/>

    <!-- ========== RELACIONES ZONA IZQUIERDA ========== -->

    <!-- Club - pertenece_a - Usuario -->
    <polygon points="90,145 115,160 90,175 65,160" class="relationship"/>
    <text x="90" y="163" text-anchor="middle" class="attrlabel">pertenece_a</text>
    <line x1="90" y1="92" x2="90" y2="145" class="line"/>
    <line x1="90" y1="175" x2="90" y2="300" class="line"/>
    <text x="98" y="120" class="cardinality">1</text>
    <text x="98" y="250" class="cardinality">N</text>

    <!-- Atributos pertenece_a -->
    <ellipse cx="35" cy="160" rx="30" ry="10" class="attr"/>
    <text x="35" y="163" text-anchor="middle" class="attrlabel">esPrincipal</text>
    <line x1="65" y1="160" x2="55" y2="160" class="line"/>

    <ellipse cx="90" cy="195" rx="35" ry="10" class="attr"/>
    <text x="90" y="198" text-anchor="middle" class="attrlabel">fechaInicio</text>
    <line x1="90" y1="175" x2="90" y2="188" class="line"/>

    <ellipse cx="155" cy="160" rx="28" ry="10" class="attr"/>
    <text x="155" y="163" text-anchor="middle" class="attrlabel">fechaFin</text>
    <line x1="115" y1="160" x2="135" y2="160" class="line"/>

    <!-- Club - tiene - Equipo -->
    <polygon points="150,115 175,130 150,145 125,130" class="relationship"/>
    <text x="150" y="133" text-anchor="middle" class="attrlabel">tiene</text>
    <line x1="130" y1="92" x2="125" y2="130" class="line"/>
    <line x1="175" y1="130" x2="180" y2="160" class="line"/>
    <text x="120" y="108" class="cardinality">1</text>
    <text x="182" y="150" class="cardinality">N</text>

    <!-- Usuario - entrena - Equipo (COACH - NUEVA RELACIÓN) -->
    <polygon points="150,250 175,265 150,280 125,265" class="relationship"/>
    <text x="150" y="268" text-anchor="middle" class="attrlabel">entrena</text>
    <line x1="130" y1="300" x2="125" y2="280" class="line"/>
    <line x1="175" y1="265" x2="220" y2="192" class="line"/>
    <text x="115" y="293" class="cardinality">0..N</text>
    <text x="200" y="225" class="cardinality">0..1</text>

    <!-- Usuario - forma_parte - Equipo (Jugadores) -->
    <polygon points="150,360 175,375 150,390 125,375" class="relationship"/>
    <text x="150" y="378" text-anchor="middle" class="attrlabel">forma_parte</text>
    <line x1="130" y1="332" x2="125" y2="375" class="line"/>
    <line x1="175" y1="375" x2="260" y2="192" class="line"/>
    <text x="115" y="355" class="cardinality">N</text>
    <text x="225" y="280" class="cardinality">0..N</text>

    <!-- ========== RELACIONES ZONA CENTRAL ========== -->

    <!-- Club - dispone_de - Material -->
    <polygon points="320,115 345,130 320,145 295,130" class="relationship"/>
    <text x="320" y="133" text-anchor="middle" class="attrlabel">dispone_de</text>
    <line x1="130" y1="76" x2="295" y2="130" class="line"/>
    <line x1="345" y1="130" x2="400" y2="176" class="line"/>
    <text x="200" y="95" class="cardinality">1</text>
    <text x="375" y="158" class="cardinality">N</text>

    <!-- Ejercicio - requiere - Material -->
    <polygon points="440,115 465,130 440,145 415,130" class="relationship"/>
    <text x="440" y="133" text-anchor="middle" class="attrlabel">requiere</text>
    <line x1="440" y1="92" x2="440" y2="115" class="line"/>
    <line x1="440" y1="145" x2="440" y2="160" class="line"/>
    <text x="450" y="108" class="cardinality">N</text>
    <text x="450" y="155" class="cardinality">N</text>

    <!-- Usuario - crea - Planificación -->
    <polygon points="560,115 590,132 560,150 530,132" class="relationship"/>
    <text x="560" y="135" text-anchor="middle" class="attrlabel">crea</text>
    <line x1="130" y1="300" x2="530" y2="132" class="line"/>
    <line x1="590" y1="132" x2="700" y2="76" class="line"/>
    <text x="300" y="230" class="cardinality">1</text>
    <text x="650" y="100" class="cardinality">N</text>

    <!-- ========== RELACIONES ZONA DERECHA ========== -->

    <!-- Planificación - tiene_versiones - VersiónPlanificación -->
    <polygon points="830,115 860,132 830,150 800,132" class="identifying"/>
    <text x="830" y="135" text-anchor="middle" class="attrlabel">tiene_versiones</text>
    <line x1="800" y1="92" x2="800" y2="132" class="line"/>
    <line x1="860" y1="132" x2="900" y2="176" class="line"/>
    <text x="790" y="115" class="cardinality">1</text>
    <text x="885" y="158" class="cardinality">N</text>

    <!-- Planificación - tiene_activa - VersiónPlanificación -->
    <polygon points="870,60 900,77 870,95 840,77" class="relationship"/>
    <text x="870" y="80" text-anchor="middle" class="attrlabel">tiene_activa</text>
    <line x1="800" y1="76" x2="840" y2="77" class="line dash"/>
    <line x1="900" y1="77" x2="960" y2="160" class="line dash"/>
    <text x="815" y="68" class="cardinality">0..1</text>
    <text x="938" y="115" class="cardinality">0..1</text>

    <!-- ========== FILA 4: Asignaciones y Feedback ========== -->

    <!-- asigna (relación ternaria) -->
    <polygon points="500,320 540,345 500,370 460,345" class="relationship"/>
    <text x="500" y="348" text-anchor="middle" class="attrlabel">asigna</text>

    <!-- Usuario (Asignador) -> asigna -->
    <line x1="130" y1="310" x2="460" y2="340" class="line"/>
    <text x="280" y="318" class="role">Asignador</text>

    <!-- Usuario (Destinatario) -> asigna -->
    <line x1="130" y1="325" x2="460" y2="350" class="line"/>
    <text x="280" y="348" class="role">Destinatario</text>

    <!-- Planificación -> asigna -->
    <line x1="750" y1="92" x2="540" y2="345" class="line"/>
    <text x="655" y="210" class="cardinality">N</text>

    <!-- Atributos de asigna -->
    <ellipse cx="500" cy="400" rx="45" ry="10" class="attr"/>
    <text x="500" y="403" text-anchor="middle" class="attrlabel">fechaAsignación</text>
    <line x1="500" y1="370" x2="500" y2="393" class="line"/>

    <ellipse cx="420" cy="345" rx="28" ry="10" class="attr"/>
    <text x="420" y="348" text-anchor="middle" class="attrlabel">estado</text>
    <line x1="460" y1="345" x2="442" y2="345" class="line"/>

    <ellipse cx="580" cy="345" rx="35" ry="10" class="attr"/>
    <text x="580" y="348" text-anchor="middle" class="attrlabel">versionId</text>
    <line x1="540" y1="345" x2="553" y2="345" class="line"/>

    <!-- evalúa (Feedback) -->
    <polygon points="800,320 840,345 800,370 760,345" class="relationship"/>
    <text x="800" y="348" text-anchor="middle" class="attrlabel">evalúa</text>

    <!-- Usuario -> evalúa -->
    <line x1="130" y1="316" x2="760" y2="345" class="line"/>
    <text x="450" y="325" class="cardinality">N</text>

    <!-- VersiónPlanificación -> evalúa -->
    <line x1="960" y1="192" x2="840" y2="345" class="line"/>
    <text x="910" y="270" class="cardinality">N</text>

    <!-- Atributos de evalúa -->
    <ellipse cx="800" cy="400" rx="35" ry="10" class="attr"/>
    <text x="800" y="403" text-anchor="middle" class="attrlabel">puntuación</text>
    <line x1="800" y1="370" x2="800" y2="393" class="line"/>

    <ellipse cx="720" cy="345" rx="35" ry="10" class="attr"/>
    <text x="720" y="348" text-anchor="middle" class="attrlabel">idSesión</text>
    <line x1="760" y1="345" x2="748" y2="345" class="line"/>

    <ellipse cx="880" cy="345" rx="38" ry="10" class="attr"/>
    <text x="880" y="348" text-anchor="middle" class="attrlabel">comentarios</text>
    <line x1="840" y1="345" x2="850" y2="345" class="line"/>

    <ellipse cx="880" cy="380" rx="38" ry="10" class="attr"/>
    <text x="880" y="383" text-anchor="middle" class="attrlabel">tipoObjetivo</text>
    <line x1="840" y1="355" x2="855" y2="375" class="line"/>

    <!-- ========== FILA 5: LogAuditoría y Métrica ========== -->

    <!-- genera_evento -->
    <polygon points="280,480 320,505 280,530 240,505" class="relationship"/>
    <text x="280" y="508" text-anchor="middle" class="attrlabel">genera_evento</text>

    <line x1="90" y1="332" x2="240" y2="505" class="line"/>
    <text x="150" y="420" class="cardinality">0..N</text>

    <!-- Atributos genera_evento -->
    <ellipse cx="280" cy="560" rx="26" ry="10" class="attr"/>
    <text x="280" y="563" text-anchor="middle" class="attrlabel">acción</text>
    <line x1="280" y1="530" x2="280" y2="553" class="line"/>

    <ellipse cx="210" cy="505" rx="26" ry="10" class="attr"/>
    <text x="210" y="508" text-anchor="middle" class="attrlabel">entidad</text>
    <line x1="240" y1="505" x2="230" y2="505" class="line"/>

    <ellipse cx="350" cy="505" rx="32" ry="10" class="attr"/>
    <text x="350" y="508" text-anchor="middle" class="attrlabel">metadatos</text>
    <line x1="320" y1="505" x2="326" y2="505" class="line"/>

    <!-- LogAuditoría -->
    <rect x="440" y="490" width="100" height="32" rx="4" class="entity"/>
    <text x="490" y="510" text-anchor="middle" class="label">LogAuditoría</text>
    <line x1="320" y1="505" x2="440" y2="506" class="line"/>
    <text x="390" y="498" class="cardinality">N</text>

    <ellipse cx="420" cy="506" rx="18" ry="10" class="attr"/>
    <text x="420" y="509" text-anchor="middle" class="attrlabel">id</text>
    <line x1="440" y1="506" x2="432" y2="506" class="line"/>

    <ellipse cx="490" cy="540" rx="32" ry="10" class="attr"/>
    <text x="490" y="543" text-anchor="middle" class="attrlabel">idSolicitud</text>
    <line x1="490" y1="522" x2="490" y2="533" class="line"/>

    <ellipse cx="560" cy="506" rx="24" ry="10" class="attr"/>
    <text x="560" y="509" text-anchor="middle" class="attrlabel">idEntidad</text>
    <line x1="540" y1="506" x2="544" y2="506" class="line"/>

    <!-- Métrica -->
    <rect x="640" y="490" width="80" height="32" rx="4" class="entity"/>
    <text x="680" y="510" text-anchor="middle" class="label">Métrica</text>

    <ellipse cx="620" cy="506" rx="18" ry="10" class="attr"/>
    <text x="620" y="509" text-anchor="middle" class="attrlabel">id</text>
    <line x1="640" y1="506" x2="632" y2="506" class="line"/>

    <ellipse cx="680" cy="540" rx="42" ry="10" class="attr"/>
    <text x="680" y="543" text-anchor="middle" class="attrlabel">marcaTemporal</text>
    <line x1="680" y1="522" x2="680" y2="533" class="line"/>

    <ellipse cx="740" cy="490" rx="24" ry="10" class="attr"/>
    <text x="740" y="493" text-anchor="middle" class="attrlabel">usoCPU</text>
    <line x1="720" y1="500" x2="724" y2="497" class="line"/>

    <ellipse cx="740" cy="520" rx="32" ry="10" class="attr"/>
    <text x="740" y="523" text-anchor="middle" class="attrlabel">usoMemoria</text>
    <line x1="720" y1="515" x2="716" y2="518" class="line"/>

    <!-- LEYENDA -->
    <text x="50" y="620" class="card">
      Nota: VersiónPlanificación está dibujada como entidad débil (doble borde). "tiene_versiones" es relación identificadora (doble borde).
    </text>
    <text x="50" y="635" class="card">
      La relación "entrena" representa al entrenador (coach) de un equipo (0..1 entrenador por equipo).
    </text>
    <text x="50" y="650" class="card">
      La relación "forma_parte" representa a los jugadores de un equipo (N:M).
    </text>
  </svg>
</div>
</body>
</html>
